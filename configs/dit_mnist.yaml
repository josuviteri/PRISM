# DiT incondicional sobre MNIST. patch_size=2 divide 28x28 sin recortes.

experimento:
  nombre: dit_mnist_ddpm_v0.1
  seed: 42

datos:
  nombre: mnist
  ruta: data/data/mnist
  val_frac: 0.1
  seed: 42
  subset: null
  batch_size: 128
  num_workers: 4
  pin_memory: true
  augment: false

modelo:
  nombre: dit_mnist
  arquitectura: dit
  hidden_size: 128
  depth: 4
  num_heads: 4
  patch_size: 2
  mlp_ratio: 4.0
  dropout: 0.1
  num_classes: 1
  diffusion_steps: 1000
  ddim_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.9995
  ema_warmup: true

entrenamiento:
  learning_rate: 0.0002
  warmup_steps: 1000
  epochs: 110
  optimizador: adam
  grad_clip: 1.0
  horizontal_flip: false
  compile: true
  dispositivo: auto
  directorio_checkpoints: checkpoints
  p_uncond: 0.0
  guidance_scale: 1.0
  reanudar: false
  muestras_cada_epocas: 10
  muestras_n: 64
  directorio_muestras: samples

metricas:
  checkpoint: checkpoints/dit_mnist_ddpm_v0.1.pt
  evaluator_checkpoint: checkpoints/mnist_evaluator_v0.1.pt
  num_samples: 10000
  batch_size: 512
  dispositivo: auto
  metodo: DDIM

wandb:
  proyecto: PRISM
  entidad: Viteritarrak
  modo: online
