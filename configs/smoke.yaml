# Configuracion del smoke test: el pipeline ENTERO, en miniatura.
# Tiene que terminar en menos de 5 minutos en CPU (regla 5/20).
# No se trata de entrenar bien: se trata de demostrar que todas las piezas
# encajan y que hay una metrica al final.

experimento:
  nombre: smoke
  seed: 42

datos:
  nombre: cifar10
  ruta: data/data/cifar-10
  subset: 64
  batch_size: 8
  num_workers: 0
  pin_memory: true

modelo:
  nombre: ddpm_cifar
  base_channels: 32
  channel_multipliers: [1, 2]
  residual_blocks: 1
  attention_resolutions: [16]
  dropout: 0.0
  diffusion_steps: 10
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.999

entrenamiento:
  learning_rate: 0.0002
  epochs: 1
  max_steps: 10
  optimizador: adam
  grad_clip: 1.0
  horizontal_flip: true
  compile: false
  dispositivo: auto
  directorio_checkpoints: checkpoints

wandb:
  proyecto: PRISM
  entidad: Viteritarrak
  modo: offline
