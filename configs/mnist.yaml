# Configuracion del entrenamiento DDPM incondicional sobre MNIST local.

experimento:
  nombre: mnist_ddpm_v0.1
  seed: 42

datos:
  nombre: mnist
  ruta: data/data/mnist
  val_frac: 0.1
  seed: 42
  subset: null
  batch_size: 128
  num_workers: 4
  pin_memory: true
  augment: false

modelo:
  nombre: ddpm_mnist
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  residual_blocks: 2
  attention_resolutions: [14, 7]
  dropout: 0.1
  diffusion_steps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.999

entrenamiento:
  learning_rate: 0.0002
  epochs: 20
  optimizador: adam
  grad_clip: 1.0
  horizontal_flip: false
  compile: false
  dispositivo: auto
  directorio_checkpoints: checkpoints

wandb:
  proyecto: PRISM
  entidad: Viteritarrak
  modo: online