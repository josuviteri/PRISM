# Todos los hiperparametros viven aqui. Ninguno escrito a fuego en el codigo:
# es lo que permite reproducir un experimento sabiendo solo que config se uso.

experimento:
  nombre: cifar10_ddpm_v0.1
  seed: 42

datos:
  nombre: cifar10
  ruta: data/data/cifar-10
  subset: null          # null = dataset completo; un entero = N muestras (regla 5/20)
  batch_size: 64
  num_workers: 2

modelo:
  nombre: ddpm_cifar
  base_channels: 128
  channel_multipliers: [1, 2, 2, 2]
  residual_blocks: 2
  attention_resolutions: [16]
  dropout: 0.1
  diffusion_steps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.999 # test 0.999 for v.0.2, originally 0.9999

entrenamiento:
  learning_rate: 0.0002
  epochs: 20
  optimizador: adam
  grad_clip: 1.0
  horizontal_flip: true
  dispositivo: auto
  directorio_checkpoints: checkpoints

wandb:
  proyecto: PRISM
  entidad: Viteritarrak         # tu usuario o equipo de W&B
  modo: online          # 'disabled' en los tests
